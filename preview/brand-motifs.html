<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Signature motifs" subtitle="Pinstripe · gold stripes" viewport="480x150" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:18px;display:flex;gap:14px}
 .m{flex:1;height:114px;border-radius:4px;border:1px solid var(--carbon-500);position:relative;overflow:hidden;display:flex;align-items:flex-end}
 .cap{position:relative;z-index:2;font:700 10px var(--font-body);letter-spacing:0.14em;text-transform:uppercase;color:#F2F2F2;padding:10px 12px;background:linear-gradient(0deg,rgba(14,15,19,0.9),transparent);width:100%;box-sizing:border-box}
 .pinstripe{background:var(--carbon-800) var(--pinstripe)}
 .stripes{background:var(--carbon-800)}
 .stripes::before{content:"";position:absolute;top:0;bottom:0;left:18px;width:26px;background:linear-gradient(90deg,#C9A84C 0,#C9A84C 4px,transparent 4px,transparent 11px,#C9A84C 11px,#C9A84C 15px,transparent 15px,transparent 22px,#C9A84C 22px,#C9A84C 26px);opacity:0.95}
 .diamond{background:var(--carbon-800);display:flex;align-items:center;justify-content:center}
 .diamond .d{position:absolute;width:64px;height:64px;transform:rotate(45deg);background:var(--purple-deep);border:2px solid var(--gold);border-radius:4px;top:14px;left:50%;margin-left:-32px}
</style></head>
<body>
 <div class="m pinstripe"><span class="cap">Purple pinstripe</span></div>
 <div class="m stripes"><span class="cap">Gold authority stripes</span></div>
</body></html>
