<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Hierarchy in use" subtitle="Black + gold edge + purple precision" viewport="700x230" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-800);font-family:var(--font-body);padding:0;height:230px;position:relative;overflow:hidden}
 .bg{position:absolute;inset:0;background:var(--pinstripe);opacity:0.5}
 .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
 .wrap{position:relative;z-index:2;padding:22px 30px}
 .ey{font:700 11px var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold)}
 h3{font:900 38px/0.9 var(--font-display);text-transform:uppercase;color:#F2F2F2;margin:8px 0 8px;letter-spacing:0.01em}
 h3 em{color:var(--gold);font-style:normal}
 p{font:400 14px/1.5 var(--font-body);color:rgba(242,242,242,0.6);margin:0;max-width:430px}
 .rule{display:inline-block;margin-top:16px;font:600 11px var(--font-body);letter-spacing:0.06em;color:rgba(242,242,242,0.5);border-top:1px solid var(--gold);padding-top:8px}
</style></head>
<body>
 <div class="bg"></div>
 <div class="edge"></div>
 <div class="wrap">
  <span class="ey">Hierarchy in use · 84 / 8 / 5 / 3</span>
  <h3>Black with a <em>gold edge</em>,<br>purple precision</h3>
  <p>Carbon dominates. Gold draws the authority line at the edge. Purple lives only in the pinstripe texture. White reads.</p>
  <span class="rule">If it looks purple-and-black, it's wrong.</span>
 </div>
</body></html>
