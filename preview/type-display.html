<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Display — Barlow Condensed" subtitle="ExtraBold, all caps, condensed" viewport="700x175" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-800);padding:20px 24px;position:relative;overflow:hidden}
 .ey{font:var(--eyebrow);letter-spacing:var(--track-eyebrow);color:var(--gold);text-transform:uppercase}
 .big{font:900 88px/0.86 var(--font-display);letter-spacing:0.01em;text-transform:uppercase;color:#F2F2F2;margin:6px 0 2px}
 .big em{color:var(--gold);font-style:normal}
 .meta{font:var(--caption);color:rgba(242,242,242,0.5);letter-spacing:0.04em}
 .gold-edge{position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--gold-stripes)}
</style></head>
<body>
 <div class="gold-edge"></div>
 <div class="ey">Display · Barlow Condensed ExtraBold</div>
 <div class="big">PRIME <em>VOLEY</em></div>
 <div class="meta">900 weight · ALL CAPS · leading 0.86–0.94 · tracking 0.01em · jersey numbers · titles</div>
</body></html>
