<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Elevation & shadows" subtitle="Tight near-black + gold glow" viewport="700x150" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:28px 22px;display:flex;gap:22px;align-items:center}
 .lab{position:absolute;top:14px;left:22px;font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold)}
 .e{width:118px;height:74px;background:var(--carbon-700);border:1px solid var(--carbon-500);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
 .e b{font:600 12px var(--font-display);letter-spacing:0.06em;text-transform:uppercase;color:#F2F2F2}
 .e span{font:10px var(--font-body);color:rgba(242,242,242,0.4)}
</style></head>
<body>
 <span class="lab">Elevation — tight, near-black</span>
 <div class="e" style="box-shadow:0 1px 2px rgba(0,0,0,0.4)"><b>sm</b><span>1·2 / .4</span></div>
 <div class="e" style="box-shadow:0 6px 18px rgba(0,0,0,0.45)"><b>md</b><span>6·18 / .45</span></div>
 <div class="e" style="box-shadow:0 18px 48px rgba(0,0,0,0.55)"><b>lg</b><span>18·48 / .55</span></div>
 <div class="e" style="border-color:#C9A84C;box-shadow:0 0 0 1px rgba(201,168,76,0.5),0 4px 18px rgba(201,168,76,0.18)"><b style="color:#C9A84C">glow</b><span>gold authority</span></div>
</body></html>
