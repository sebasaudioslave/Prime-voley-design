<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Gold & purple ramps" subtitle="Authority + precision tonal steps" viewport="700x150" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:18px}
 .lab{font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .row{display:flex;gap:6px}
 .c{flex:1;height:64px;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px;box-sizing:border-box}
 .c b{font:600 10px/1.1 var(--font-body)}
 .c span{font:9px/1.2 var(--font-body);letter-spacing:0.02em;opacity:0.75}
</style></head>
<body>
 <div class="grid">
  <div>
   <p class="lab">Gold — authority</p>
   <div class="row">
    <div class="c" style="background:#DCC067;color:#15161C"><b>Bright</b><span>#DCC067</span></div>
    <div class="c" style="background:#C9A84C;color:#15161C"><b>Base</b><span>#C9A84C</span></div>
    <div class="c" style="background:#9E8338;color:#F2F2F2"><b>Deep</b><span>#9E8338</span></div>
   </div>
  </div>
  <div>
   <p class="lab" style="color:#6553C4">Purple — precision</p>
   <div class="row">
    <div class="c" style="background:#6553C4;color:#F2F2F2"><b>Bright</b><span>#6553C4</span></div>
    <div class="c" style="background:#4C3B9A;color:#F2F2F2"><b>Base</b><span>#4C3B9A</span></div>
    <div class="c" style="background:#2F2563;color:#F2F2F2"><b>Deep</b><span>#2F2563</span></div>
   </div>
  </div>
 </div>
</body></html>
