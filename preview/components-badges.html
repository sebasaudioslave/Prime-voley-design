<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Badges & status chips" subtitle="VNL-style tabs, dropdowns, toggle, status" viewport="700x250" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-800);font-family:var(--font-body);padding:20px 22px;display:flex;flex-direction:column;gap:16px}
 .lab{font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0}
 .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

 /* tab pills — outlined rounded rects, active filled (VNL pattern) */
 .tab{font:600 14px/1 var(--font-body);padding:11px 18px;border-radius:7px;border:1.5px solid var(--carbon-400);
   background:transparent;color:var(--white-dim);cursor:pointer}
 .tab.on{background:var(--gold);border-color:var(--gold);color:#15161C;font-weight:700}

 /* underline sub-tabs */
 .sub{display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--carbon-500);padding-bottom:0}
 .sub a{font:600 13px/1 var(--font-body);color:var(--white-faint);text-decoration:none;padding:0 0 10px;position:relative}
 .sub a.on{color:#F2F2F2}
 .sub a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--gold)}

 /* dropdown filter chips with caret */
 .dd{display:inline-flex;align-items:center;gap:10px;font:600 12px/1 var(--font-body);letter-spacing:0.02em;
   text-transform:uppercase;padding:10px 13px;border-radius:7px;border:1.5px solid var(--carbon-400);
   background:var(--carbon-700);color:#F2F2F2;cursor:pointer}
 .dd svg{opacity:0.7}

 /* toggle */
 .tog{display:inline-flex;align-items:center;gap:10px;font:600 12px var(--font-body);color:var(--white-dim)}
 .sw{width:38px;height:21px;border-radius:999px;background:var(--gold);position:relative}
 .sw::after{content:"";position:absolute;top:2.5px;right:2.5px;width:16px;height:16px;border-radius:50%;background:#15161C}

 /* status tags — small rounded rects */
 .tag{font:700 11px/1 var(--font-body);letter-spacing:0.06em;text-transform:uppercase;padding:7px 11px;border-radius:6px;
   border:1.5px solid var(--carbon-400);color:var(--white-dim);background:var(--carbon-700)}
 .tag.gold{border-color:var(--gold);color:var(--gold)}
 .tag.win{border-color:rgba(91,174,122,0.6);color:#8FC9A6}
 .tag.loss{border-color:var(--carbon-400);color:var(--white-faint)}
 .tag.live{border-color:transparent;background:var(--gold);color:#15161C;display:inline-flex;align-items:center;gap:6px}
 .tag.live .d{width:6px;height:6px;border-radius:50%;background:#15161C}
</style></head>
<body>
 <p class="lab">Tabs, filters &amp; status · VNL diagramming</p>
 <div class="row">
  <button class="tab on">Equipo</button>
  <button class="tab">Calendario</button>
  <button class="tab">Resultados</button>
  <button class="tab">Videos</button>
 </div>
 <div class="sub">
  <a class="on">Vista semanal</a>
  <a>En vivo</a>
  <a>Tabla</a>
 </div>
 <div class="row">
  <span class="dd">Categoría <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="#C9A84C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="dd">Jornada <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="#C9A84C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="dd">Rival <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="#C9A84C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="tog"><span class="sw"></span>Hora local</span>
 </div>
 <div class="row">
  <span class="tag gold">Sub-19</span>
  <span class="tag">Titular</span>
  <span class="tag win">Victoria 3–0</span>
  <span class="tag loss">Derrota 1–3</span>
  <span class="tag live"><span class="d"></span>En vivo</span>
 </div>
</body></html>
