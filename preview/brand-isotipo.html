<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Isotipo" subtitle="Arco y flecha · Royal Gold · SVG vectorial" viewport="400x200" -->
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);display:flex;align-items:center;justify-content:center;height:200px;gap:40px;font-family:var(--font-body);}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lbl{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(242,242,242,0.35);}
  .iso-white{filter:brightness(0) invert(1);}
  .iso-dark{filter:brightness(0);}
</style></head>
<body>
  <div class="item">
    <img src="../assets/isotipo-prime.svg" width="80" height="80" alt="Isotipo Prime">
    <span class="lbl">Dorado</span>
  </div>
  <div class="item">
    <img src="../assets/isotipo-prime.svg" width="80" height="80" class="iso-white" alt="">
    <span class="lbl">Blanco</span>
  </div>
  <div class="item" style="background:#F0EDE6;padding:16px 12px;border-radius:2px;">
    <img src="../assets/isotipo-prime.svg" width="80" height="80" class="iso-dark" alt="">
    <span class="lbl" style="color:rgba(14,15,19,0.4);">Negro</span>
  </div>
</body></html>
