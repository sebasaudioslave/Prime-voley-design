<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Cards" subtitle="Authority + result cards" viewport="700x230" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:20px;display:flex;gap:16px}
 .card{flex:1;background:var(--carbon-700);border:1px solid var(--carbon-500);border-radius:6px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.45)}
 .card.auth{border-color:rgba(201,168,76,0.4)}
 .top{height:3px;background:var(--gold-stripes)}
 .pad{padding:16px}
 .ey{font:700 10px/1 var(--font-body);letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
 h4{font:800 22px/0.98 var(--font-display);letter-spacing:0.01em;text-transform:uppercase;color:#F2F2F2;margin:8px 0 6px}
 p{font:400 13px/1.5 var(--font-body);color:rgba(242,242,242,0.62);margin:0}
 .meta{display:flex;gap:8px;margin-top:12px;font:600 12px var(--font-body);color:rgba(242,242,242,0.5);font-variant-numeric:tabular-nums}
 .meta b{color:#C9A84C}
</style></head>
<body>
 <div class="card auth">
  <div class="top"></div>
  <div class="pad">
   <span class="ey">Próximo partido</span>
   <h4>Prime vs. Halcones</h4>
   <p>Polideportivo Zipaquirá · Cancha central.</p>
   <div class="meta"><span>SÁB 14 JUN</span><span>·</span><b>7:00 P.M.</b></div>
  </div>
 </div>
 <div class="card">
  <div class="pad">
   <span class="ey">Resultado</span>
   <h4>Prime 3 — 0 Cóndores</h4>
   <p>Sets 25–18 · 25–22 · 25–19. MVP: D. Rojas.</p>
   <div class="meta"><b>34 PTS</b><span>/</span><span>8 BLK</span><span>/</span><span>5 ACE</span></div>
  </div>
 </div>
</body></html>
