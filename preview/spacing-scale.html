<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Spacing scale" subtitle="4px base grid" viewport="700x180" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:20px}
 .lab{font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0 0 16px}
 .scale{display:flex;align-items:flex-end;gap:10px}
 .u{display:flex;flex-direction:column;align-items:center;gap:6px}
 .bar{background:var(--gold);width:22px;border-radius:2px}
 .u b{font:600 11px var(--font-body);color:#F2F2F2}
 .u span{font:10px var(--font-body);color:rgba(242,242,242,0.45)}
</style></head>
<body>
 <p class="lab">Spacing — 4px base grid</p>
 <div class="scale">
  <div class="u"><div class="bar" style="height:4px"></div><b>1</b><span>4</span></div>
  <div class="u"><div class="bar" style="height:8px"></div><b>2</b><span>8</span></div>
  <div class="u"><div class="bar" style="height:12px"></div><b>3</b><span>12</span></div>
  <div class="u"><div class="bar" style="height:16px"></div><b>4</b><span>16</span></div>
  <div class="u"><div class="bar" style="height:20px"></div><b>5</b><span>20</span></div>
  <div class="u"><div class="bar" style="height:24px"></div><b>6</b><span>24</span></div>
  <div class="u"><div class="bar" style="height:32px"></div><b>8</b><span>32</span></div>
  <div class="u"><div class="bar" style="height:40px"></div><b>10</b><span>40</span></div>
  <div class="u"><div class="bar" style="height:48px"></div><b>12</b><span>48</span></div>
  <div class="u"><div class="bar" style="height:64px"></div><b>16</b><span>64</span></div>
  <div class="u"><div class="bar" style="height:80px"></div><b>20</b><span>80</span></div>
 </div>
</body></html>
