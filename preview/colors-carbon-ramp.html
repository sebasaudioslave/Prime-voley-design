<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Carbon ramp" subtitle="Surface steps 900→400" viewport="700x150" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:18px}
 .lab{font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
 .row{display:flex;gap:6px}
 .c{flex:1;height:92px;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid rgba(255,255,255,0.06)}
 .c b{font:600 11px/1.1 var(--font-body);color:#F2F2F2}
 .c span{font:10px/1.2 var(--font-body);color:rgba(242,242,242,0.6);letter-spacing:0.03em}
</style></head>
<body>
 <p class="lab">Carbon ramp — surfaces built up from the base</p>
 <div class="row">
  <div class="c" style="background:#0E0F13"><b>900</b><span>#0E0F13</span></div>
  <div class="c" style="background:#15161C"><b>800</b><span>#15161C</span></div>
  <div class="c" style="background:#1C1E26"><b>700</b><span>#1C1E26</span></div>
  <div class="c" style="background:#242631"><b>600</b><span>#242631</span></div>
  <div class="c" style="background:#2E3140"><b>500</b><span>#2E3140</span></div>
  <div class="c" style="background:#3A3D4E"><b>400</b><span>#3A3D4E</span></div>
 </div>
</body></html>
