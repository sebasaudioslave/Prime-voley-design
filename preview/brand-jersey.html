<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Jersey color reference" subtitle="Canonical balance — Icons jersey" viewport="700x230" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-900);font-family:var(--font-body);padding:0;display:flex;height:230px}
 .img{width:230px;flex:none;background:#15161C;position:relative}
 .img img{width:100%;height:100%;object-fit:cover;object-position:center top}
 .txt{flex:1;padding:20px 22px;display:flex;flex-direction:column;justify-content:center}
 .ey{font:700 11px var(--font-body);letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
 h4{font:800 24px/1 var(--font-display);text-transform:uppercase;color:#F2F2F2;margin:8px 0 10px}
 p{font:400 13px/1.55 var(--font-body);color:rgba(242,242,242,0.62);margin:0;max-width:340px}
 .leg{display:flex;gap:8px;margin-top:14px}
 .leg span{display:flex;align-items:center;gap:5px;font:11px var(--font-body);color:rgba(242,242,242,0.55)}
 .leg i{width:11px;height:11px;border-radius:2px;display:inline-block}
</style></head>
<body>
 <div class="img"><img src="../assets/jersey-reference.avif" alt="Reference jersey"></div>
 <div class="txt">
  <span class="ey">Color balance reference</span>
  <h4>The Icons jersey</h4>
  <p>The canonical proportion: black base, gold stripes as authority marks, purple only as thin pinstripes. Match this restraint.</p>
  <div class="leg">
   <span><i style="background:#15161C;outline:1px solid #2E3140"></i>Base</span>
   <span><i style="background:#C9A84C"></i>Stripes</span>
   <span><i style="background:#4C3B9A"></i>Pinstripe</span>
  </div>
 </div>
</body></html>
