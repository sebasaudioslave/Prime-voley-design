<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Text & semantic colors" subtitle="fg1–3, accent, win/loss" viewport="700x250" --><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0}
 body{background:var(--carbon-800);font-family:var(--font-body);padding:20px}
 .lab{font:700 11px/1 var(--font-body);letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
 .rows{display:flex;flex-direction:column;gap:11px}
 .r{display:flex;align-items:center;gap:14px}
 .r .t{min-width:230px}
 .r code{font:11px/1 var(--font-body);color:rgba(242,242,242,0.4);letter-spacing:0.02em}
 .dot{width:16px;height:16px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,0.1)}
</style></head>
<body>
 <p class="lab">Text &amp; semantic — on carbon</p>
 <div class="rows">
  <div class="r"><span class="dot" style="background:#F2F2F2"></span><span class="t" style="color:#F2F2F2;font:600 16px var(--font-body)">fg1 · primary text &amp; data</span><code>#F2F2F2</code></div>
  <div class="r"><span class="dot" style="background:rgba(242,242,242,0.66)"></span><span class="t" style="color:rgba(242,242,242,0.66);font:400 16px var(--font-body)">fg2 · supporting text</span><code>white 66%</code></div>
  <div class="r"><span class="dot" style="background:rgba(242,242,242,0.42)"></span><span class="t" style="color:rgba(242,242,242,0.42);font:400 16px var(--font-body)">fg3 · captions / fine print</span><code>white 42%</code></div>
  <div class="r"><span class="dot" style="background:#C9A84C"></span><span class="t" style="color:#C9A84C;font:700 16px var(--font-body)">accent · gold authority</span><code>#C9A84C</code></div>
  <div class="r"><span class="dot" style="background:#6553C4"></span><span class="t" style="color:#8A7BD8;font:600 16px var(--font-body)">interactive · purple focus</span><code>#6553C4</code></div>
  <div class="r"><span class="dot" style="background:#5BAE7A"></span><span class="t" style="color:#8FC9A6;font:600 16px var(--font-body)">positive · victoria</span><code>#5BAE7A</code></div>
  <div class="r"><span class="dot" style="background:#5A5C68"></span><span class="t" style="color:rgba(242,242,242,0.5);font:600 16px var(--font-body)">muted · derrota / inactivo</span><code>slate · sin rojo</code></div>
 </div>
</body></html>
