 .wm .sub{font:var(--eyebrow);letter-spacing:var(--track-eyebrow);color:var(--white-dim);padding-top:8px;border-top:1px solid var(--gold);display:inline-block;margin-top:8px}
 .lock{display:flex;align-items:center;gap:14px;margin-top:12px}
 .lh{font:800 24px/0.9 var(--font-display);text-transform:uppercase;color:#F2F2F2}
 .lh em{color:var(--gold);font-style:normal}
 .vein{stroke:#0E0F13;stroke-width:0.9;stroke-linecap:round}
</style>
