<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de Reconocimiento Deportivo — Prime (Identidad de Marca)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#15161C; --carbon-900:#0E0F13; --carbon-800:#15161C; --carbon-700:#1C1E26;
  --gold:#C9A84C; --gold-bright:#DCC067; --gold-deep:#9E8338;
  --purple:#4C3B9A; --purple-deep:#2F2563;
  --paper:#FBFBFC;
  --ink:#15161C;
  --ink-2:rgba(21,22,28,0.64);
  --ink-3:rgba(21,22,28,0.46);
  --rule:rgba(76,59,154,0.34);
  --rule-faint:rgba(21,22,28,0.14);
  --font-display:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;
  --font-body:'Space Grotesk','Inter',system-ui,sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:radial-gradient(130% 90% at 50% 0%, #2A2C38 0%, #15161C 70%);
  font-family:var(--font-body); color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
#pages{ display:flex; flex-direction:column; align-items:center; gap:30px; padding:42px 16px 70px; }
.page{ position:relative; width:816px; height:1056px; background:var(--paper);
  box-shadow:0 22px 50px -16px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4); overflow:hidden; }

/* running header (non-masthead pages) */
.page-header{ position:absolute; top:46px; left:104px; right:104px; display:flex; justify-content:space-between; align-items:center;
  padding-bottom:9px; border-bottom:1.5px solid var(--gold); }
.page-header .hh-club{ font:700 10px/1 var(--font-body); letter-spacing:.16em; text-transform:uppercase; color:var(--ink); white-space:nowrap; }
.page-header .hh-right{ font:500 10px/1 var(--font-body); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; }
.page-footer{ position:absolute; bottom:40px; left:104px; right:104px; display:flex; justify-content:space-between; align-items:center;
  padding-top:9px; border-top:1px solid var(--rule-faint); font:500 9.5px/1 var(--font-body); letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); }
.page-footer .pf-mark{ color:var(--purple); font-weight:700; }
.page-content{ position:absolute; top:84px; left:104px; width:608px; }
.page.has-masthead .page-content{ top:64px; }

/* ---- membrete: paper details ---- */
.page-edge{ position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }
.page-edge::after{ content:""; position:absolute; top:3px; left:0; right:0; height:1px; background:var(--purple); opacity:.5; }
.page-watermark{ position:absolute; inset:0; background:url("assets/escudo-prime.png") center 56% / 440px auto no-repeat; opacity:0.038; filter:grayscale(1); pointer-events:none; }
.lh-iso{ display:block; height:100px; width:auto; margin:0 auto 14px; }

/* ---- letterhead: brand carried by type, gold & purple as fine accents ---- */
.letterhead{ text-align:center; padding-top:2px; margin:0 0 36px; }
.lh-kicker{ font:600 10px/1 var(--font-body); letter-spacing:.34em; text-transform:uppercase; color:var(--gold-deep); padding-left:.34em; margin-bottom:16px; }
.lh-club{ font:700 44px/0.98 var(--font-display); letter-spacing:.07em; text-transform:uppercase; color:var(--carbon); padding-left:.07em; }
.lh-rule{ display:flex; align-items:center; justify-content:center; width:54%; margin:19px auto 14px; }
.lh-rule::before,.lh-rule::after{ content:""; flex:1; height:1px; background:rgba(21,22,28,0.18); }
.lh-rule i{ width:6px; height:6px; border:1.5px solid var(--gold); transform:rotate(45deg); margin:0 14px; }
.lh-tag{ font:500 11px/1.4 var(--font-body); letter-spacing:.26em; text-transform:uppercase; color:var(--purple); padding-left:.26em; }

/* ---- date + recipient ---- */
.date{ text-align:right; font:500 14px/1.4 var(--font-body); color:var(--ink-2); margin:0 0 26px; }
.recipient{ margin:0 0 22px; line-height:1.6; font:400 14.5px/1.6 var(--font-body); }
.recipient .rcpt-fill{ color:var(--ink-3); }

/* ---- asunto ---- */
.asunto{ margin:0 0 22px; font:400 14.5px/1.5 var(--font-body); padding-left:16px; border-left:3px solid var(--gold); }
.asunto .as-label{ font:700 12px/1 var(--font-body); letter-spacing:.18em; text-transform:uppercase; color:var(--purple); margin-right:.3em; }

.salut{ margin:0 0 16px; font:400 14.5px var(--font-body); }
p{ margin:0; }
.body{ font:400 14.5px/1.62 var(--font-body); text-align:left; margin:0 0 13px; color:var(--ink); }
.lead{ margin-bottom:10px; }
.oitem{ font:400 14.5px/1.5 var(--font-body); padding-left:2em; text-indent:-2em; margin:0 0 6px; }
.oitem .oi-num{ display:inline-block; min-width:1.3em; font:700 13px/1 var(--font-body); color:var(--gold-deep); }

/* ---- contact fields ---- */
.fields{ margin:8px 0 18px; }
.field{ display:grid; grid-template-columns:170px 1fr; align-items:baseline; gap:.8em; padding:9px 0; border-bottom:1px solid var(--rule-faint); }
.field:first-child{ border-top:1.5px solid var(--purple); }
.f-label{ font:700 10px/1.4 var(--font-body); letter-spacing:.16em; text-transform:uppercase; color:var(--purple); }
.f-val{ font:400 14px var(--font-body); color:var(--ink); overflow:hidden; white-space:nowrap; }

.cordial{ margin:20px 0 0; font:400 14.5px var(--font-body); }

/* ---- signature ---- */
.letter-sign{ margin-top:8px; }
.ls-space{ height:62px; }
.ls-line{ width:300px; height:2px; background:var(--carbon); margin:0 0 11px; position:relative; }
.ls-line::after{ content:""; position:absolute; left:0; bottom:-5px; width:64px; height:2px; background:var(--gold); }
.ls-name{ font:700 16px/1.1 var(--font-display); letter-spacing:.04em; text-transform:uppercase; color:var(--ink); }
.ls-role{ font:700 10.5px/1 var(--font-body); letter-spacing:.18em; text-transform:uppercase; color:var(--purple); margin-top:7px; }
.ls-club{ font:500 13px var(--font-body); color:var(--ink-2); margin-top:7px; }
.ls-cc{ font:500 12px var(--font-body); color:var(--ink-3); margin-top:5px; }
.ls-place{ font:500 12px var(--font-body); color:var(--ink-3); margin-top:2px; }

#source{ display:none; }
@media print{
  @page{ size:Letter; margin:0; }
  html,body{ background:#fff; }
  body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #pages{ gap:0; padding:0; }
  .page{ box-shadow:none; page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  *,*::before,*::after{ animation-duration:.001s !important; transition-duration:0s !important; }
}
</style>
</head>
<body>
<div id="source"></div>
<div id="pages"></div>
<script id="blocks" type="application/json">[{"masthead":true,"html":"<div class=\"letterhead\"><img class=\"lh-iso\" src=\"assets/escudo-prime.png\" alt=\"Escudo Club Deportivo Prime\"><div class=\"lh-club\">CLUB DEPORTIVO PRIME</div><div class=\"lh-rule\"><i></i></div><div class=\"lh-tag\">Zipaquirá · Cundinamarca · Colombia</div></div>"},{"html":"<p class=\"date\">Zipaquirá, Cundinamarca, ___ de __________________ de 2026</p>"},{"html":"<div class=\"recipient\"><div>Señor(a)</div><div class=\"rcpt-fill\">________________________________</div><div>Director(a) — Instituto Municipal de Recreación y Deporte de Zipaquirá (IMRDN)</div><div>Ciudad</div></div>"},{"html":"<p class=\"asunto\"><span class=\"as-label\">Asunto:</span> Solicitud de Reconocimiento Deportivo — Club Deportivo Prime</p>"},{"html":"<p class=\"salut\">Respetado(a) señor(a) Director(a):</p>"},{"html":"<p class=\"body\">Yo, David Sebastián Fonseca Carvajal, identificado con cédula de ciudadanía No. 175.684.517, en calidad de Presidente y Representante Legal del CLUB DEPORTIVO PRIME, organismo deportivo de derecho privado constituido en el municipio de Zipaquirá el ___ de __________________ de 2026, me dirijo a usted respetuosamente para solicitar el reconocimiento deportivo de nuestra organización, conforme a lo establecido en la Ley 181 de 1995, el Decreto Ley 1228 de 1995 y la Resolución 000410 del 13 de mayo de 2026 del Ministerio del Deporte de Colombia.</p>"},{"html":"<p class=\"body\">El Club Deportivo Prime tiene como objeto el fomento, protección y desarrollo del deporte del voleibol en el municipio de Zipaquirá en todas sus modalidades. Contamos con un mínimo de doce (12) deportistas afiliados y hemos dado cumplimiento a los requisitos establecidos por el ente deportivo municipal para la constitución de clubes deportivos.</p>"},{"html":"<p class=\"body lead\">Para efectos del reconocimiento solicitado, adjuntamos los siguientes documentos:</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">1</span> Original o copia autenticada del Acta de Constitución No. 001.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">2</span> Original y copia de los Estatutos Sociales del Club Deportivo Prime.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">3</span> Listado de deportistas afiliados debidamente identificados.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">4</span> Acta de compromiso deportivo firmada por cada afiliado.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">5</span> Acta No. 002 de Reunión del Órgano de Administración — Asignación de cargos.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">6</span> Plan de Desarrollo Deportivo Anual.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">7</span> Dirección, teléfono y correo electrónico de la sede administrativa del Club.</p>"},{"html":"<p class=\"body lead\">Los datos de contacto del Club son los siguientes:</p>"},{"html":"<div class=\"fields\"><div class=\"field\"><span class=\"f-label\">Dirección sede administrativa</span><span class=\"f-val\">_______________________________________________</span></div><div class=\"field\"><span class=\"f-label\">Teléfono</span><span class=\"f-val\">___________________________________</span></div><div class=\"field\"><span class=\"f-label\">Correo electrónico</span><span class=\"f-val\">__________________________</span></div><div class=\"field\"><span class=\"f-label\">Municipio</span><span class=\"f-val\">Zipaquirá, Cundinamarca.</span></div></div>"},{"html":"<p class=\"body\">Agradezco su atención y quedo en espera de la respuesta favorable a la presente solicitud.</p>"},{"html":"<p class=\"cordial\">Cordialmente,</p>"},{"head":true,"html":"<div class=\"letter-sign\"><div class=\"ls-space\"></div><div class=\"ls-line\"></div><div class=\"ls-name\">David Sebastián Fonseca Carvajal</div><div class=\"ls-role\">Presidente — Representante Legal</div><div class=\"ls-club\">Club Deportivo Prime</div><div class=\"ls-cc\">C.C. 175.684.517</div><div class=\"ls-place\">Zipaquirá, Cundinamarca</div></div>"}]</script>
<script>
const BLOCKS=JSON.parse(document.getElementById('blocks').textContent);
const CONTENT_H=1056-84-120;
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function buildSource(){ const src=document.getElementById('source'); src.innerHTML=''; const nodes=[];
  for(const b of BLOCKS){ const w=document.createElement('div'); w.innerHTML=b.html; const n=w.firstElementChild;
    if(b.masthead)n.dataset.masthead='1'; if(b.head)n.dataset.head='1'; src.appendChild(n); nodes.push(n); } return nodes; }
function makePage(pagesEl,isMast){ const p=el('div','page'+(isMast?' has-masthead':''));
  p.appendChild(el('div','page-watermark')); p.appendChild(el('div','page-edge'));
  if(!isMast) p.appendChild(el('div','page-header','<span class="hh-club">Club Deportivo Prime</span><span class="hh-right">Solicitud de Reconocimiento Deportivo</span>'));
  const content=el('div','page-content'); p.appendChild(content); p.appendChild(el('div','page-footer','<span>Club Deportivo Prime</span><span class="pageno"></span>')); pagesEl.appendChild(p); return content; }
function paginate(){ const pagesEl=document.getElementById('pages'); pagesEl.innerHTML=''; const nodes=buildSource(); let content=null;
  for(const node of nodes){ const isMast=node.dataset.masthead==='1';
    if(content===null||isMast) content=makePage(pagesEl,isMast);
    const clone=node.cloneNode(true); content.appendChild(clone);
    if(content.offsetHeight>CONTENT_H){ content.removeChild(clone); content=makePage(pagesEl,false); content.appendChild(clone); }
    else if(node.dataset.head==='1' && content.offsetHeight>CONTENT_H-150){ content.removeChild(clone); content=makePage(pagesEl,false); content.appendChild(clone); }
  }
  const all=[...pagesEl.querySelectorAll('.page')]; const total=all.length;
  all.forEach((pg,idx)=>{ const n=pg.querySelector('.pageno');
    if(n) n.innerHTML = total>1 ? ('<span class="pf-mark">/</span> Página '+(idx+1)+' de '+total) : '<span class="pf-mark">/</span> Documento oficial'; });
}
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>setTimeout(paginate,60)); }
else window.addEventListener('load',()=>setTimeout(paginate,150));
</script>
</body>
</html>
