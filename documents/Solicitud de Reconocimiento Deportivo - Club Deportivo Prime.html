<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de Reconocimiento Deportivo — Club Deportivo Prime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper: oklch(0.985 0.006 85);
  --ink: oklch(0.255 0.013 55);
  --ink-soft: oklch(0.42 0.012 55);
  --ink-faint: oklch(0.55 0.012 58);
  --rule: oklch(0.62 0.015 60);
  --rule-faint: oklch(0.80 0.012 70);
  --backdrop: oklch(0.46 0.012 60);
  --serif: "EB Garamond","Hoefler Text",Garamond,"Times New Roman",serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:radial-gradient(120% 80% at 50% 0%, oklch(0.5 0.012 60) 0%, var(--backdrop) 70%);
  font-family:var(--serif); color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-feature-settings:"liga" 1,"onum" 1,"kern" 1; }
#pages{ display:flex; flex-direction:column; align-items:center; gap:30px; padding:42px 16px 70px; }
.page{ position:relative; width:816px; height:1056px; background:var(--paper);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 22px 50px -18px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.2); overflow:hidden; }
.page-header{ position:absolute; top:44px; left:104px; right:104px; display:flex; justify-content:space-between; align-items:baseline;
  font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-soft); font-weight:500; padding-bottom:9px; border-bottom:0.6px solid var(--rule-faint); }
.page-header .hr-right{ letter-spacing:.16em; font-style:italic; text-transform:none; font-size:10.5px; }
.page-footer{ position:absolute; bottom:40px; left:104px; right:104px; display:flex; justify-content:center; align-items:center;
  font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap; }
.page-footer::before,.page-footer::after{ content:""; flex:0 0 26px; height:0.6px; background:var(--rule-faint); margin:0 16px; }
.page-content{ position:absolute; top:84px; left:104px; width:608px; }
.page.has-masthead .page-content{ top:78px; }

/* letterhead */
.letterhead{ text-align:center; margin:4px 0 30px; }
.lh-emblem{ width:6px; height:6px; background:var(--ink); transform:rotate(45deg); margin:0 auto 16px; }
.lh-club{ font-size:23px; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--ink); padding-left:.2em; }
.lh-place{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); margin-top:8px; padding-left:.2em; }
.lh-rule{ height:0.8px; background:var(--rule); margin:18px auto 0; width:100%; }

/* date + recipient */
.date{ text-align:right; font-style:italic; font-size:14.5px; color:var(--ink-soft); margin:0 0 26px; }
.recipient{ margin:0 0 22px; line-height:1.55; font-size:15px; }
.recipient .rcpt-fill{ color:var(--ink-faint); letter-spacing:.02em; }

/* asunto */
.asunto{ margin:0 0 20px; font-size:15px; line-height:1.5; }
.asunto .as-label{ font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:12.5px; }

.salut{ margin:0 0 16px; font-size:15px; }

/* body */
p{ margin:0; }
.body{ font-size:15px; line-height:1.66; text-align:justify; hyphens:auto; -webkit-hyphens:auto; margin:0 0 13px; }
.lead{ margin-bottom:9px; }
.oitem{ font-size:15px; line-height:1.55; padding-left:1.9em; text-indent:-1.9em; margin:0 0 5px; }
.oitem .oi-num{ font-weight:600; font-variant-numeric:lining-nums; }

/* contact fields */
.fields{ margin:6px 0 16px; }
.field{ display:grid; grid-template-columns:168px 1fr; align-items:baseline; gap:.7em; padding:8px 0; border-bottom:0.6px solid var(--rule-faint); }
.field:first-child{ border-top:0.6px solid var(--rule-faint); }
.f-label{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink-soft); line-height:1.4; }
.f-val{ font-size:14.5px; color:var(--ink); overflow:hidden; white-space:nowrap; }

.cordial{ margin:18px 0 0; font-size:15px; }

/* signature block (letter) */
.letter-sign{ margin-top:8px; }
.ls-space{ height:64px; }
.ls-line{ width:300px; height:0.8px; background:var(--ink-soft); margin:0 0 10px; }
.ls-name{ font-size:15px; font-weight:600; color:var(--ink); }
.ls-role{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin-top:5px; }
.ls-club{ font-size:13px; color:var(--ink-soft); margin-top:7px; font-style:italic; }
.ls-cc{ font-size:12px; letter-spacing:.05em; color:var(--ink-soft); margin-top:6px; font-variant-numeric:lining-nums; }
.ls-place{ font-size:12px; letter-spacing:.05em; color:var(--ink-soft); margin-top:2px; }

#source{ display:none; }
@media print{
  @page{ size:Letter; margin:0; }
  html,body{ background:#fff; }
  body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #pages{ gap:0; padding:0; }
  .page{ background:#fff !important; box-shadow:none; page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  *,*::before,*::after{ animation-duration:.001s !important; transition-duration:0s !important; }
}
</style>
</head>
<body>
<div id="source"></div>
<div id="pages"></div>
<script id="blocks" type="application/json">[{"masthead":true,"html":"<div class=\"letterhead\"><div class=\"lh-emblem\"></div><div class=\"lh-club\">CLUB DEPORTIVO PRIME</div><div class=\"lh-place\">Zipaquirá, Cundinamarca · Colombia</div><div class=\"lh-rule\"></div></div>"},{"html":"<p class=\"date\">Zipaquirá, Cundinamarca, ___ de __________________ de 2026</p>"},{"html":"<div class=\"recipient\"><div>Señor(a)</div><div class=\"rcpt-fill\">________________________________</div><div>Director(a) — Instituto Municipal de Recreación y Deporte de Zipaquirá (IMRDN)</div><div>Ciudad</div></div>"},{"html":"<p class=\"asunto\"><span class=\"as-label\">Asunto:</span> Solicitud de Reconocimiento Deportivo — Club Deportivo Prime</p>"},{"html":"<p class=\"salut\">Respetado(a) señor(a) Director(a):</p>"},{"html":"<p class=\"body\">Yo, David Sebastián Fonseca Carvajal, identificado con cédula de ciudadanía No. 175.684.517, en calidad de Presidente y Representante Legal del CLUB DEPORTIVO PRIME, organismo deportivo de derecho privado constituido en el municipio de Zipaquirá el ___ de __________________ de 2026, me dirijo a usted respetuosamente para solicitar el reconocimiento deportivo de nuestra organización, conforme a lo establecido en la Ley 181 de 1995, el Decreto Ley 1228 de 1995 y la Resolución 000410 del 13 de mayo de 2026 del Ministerio del Deporte de Colombia.</p>"},{"html":"<p class=\"body\">El Club Deportivo Prime tiene como objeto el fomento, protección y desarrollo del deporte del voleibol en el municipio de Zipaquirá en todas sus modalidades. Contamos con un mínimo de doce (12) deportistas afiliados y hemos dado cumplimiento a los requisitos establecidos por el ente deportivo municipal para la constitución de clubes deportivos.</p>"},{"html":"<p class=\"body lead\">Para efectos del reconocimiento solicitado, adjuntamos los siguientes documentos:</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">1.</span> Original o copia autenticada del Acta de Constitución No. 001.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">2.</span> Original y copia de los Estatutos Sociales del Club Deportivo Prime.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">3.</span> Listado de deportistas afiliados debidamente identificados.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">4.</span> Acta de compromiso deportivo firmada por cada afiliado.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">5.</span> Acta No. 002 de Reunión del Órgano de Administración — Asignación de cargos.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">6.</span> Plan de Desarrollo Deportivo Anual.</p>"},{"html":"<p class=\"oitem\"><span class=\"oi-num\">7.</span> Dirección, teléfono y correo electrónico de la sede administrativa del Club.</p>"},{"html":"<p class=\"body lead\">Los datos de contacto del Club son los siguientes:</p>"},{"html":"<div class=\"fields\"><div class=\"field\"><span class=\"f-label\">Dirección sede administrativa</span><span class=\"f-val\">_______________________________________________</span></div><div class=\"field\"><span class=\"f-label\">Teléfono</span><span class=\"f-val\">___________________________________</span></div><div class=\"field\"><span class=\"f-label\">Correo electrónico</span><span class=\"f-val\">__________________________</span></div><div class=\"field\"><span class=\"f-label\">Municipio</span><span class=\"f-val\">Zipaquirá, Cundinamarca.</span></div></div>"},{"html":"<p class=\"body\">Agradezco su atención y quedo en espera de la respuesta favorable a la presente solicitud.</p>"},{"html":"<p class=\"cordial\">Cordialmente,</p>"},{"head":true,"html":"<div class=\"letter-sign\"><div class=\"ls-space\"></div><div class=\"ls-line\"></div><div class=\"ls-name\">David Sebastián Fonseca Carvajal</div><div class=\"ls-role\">Presidente — Representante Legal</div><div class=\"ls-club\">Club Deportivo Prime</div><div class=\"ls-cc\">C.C. 175.684.517</div><div class=\"ls-place\">Zipaquirá, Cundinamarca</div></div>"}]</script>
<script>
const BLOCKS=JSON.parse(document.getElementById('blocks').textContent);
const CONTENT_H=1056-84-120;
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function buildSource(){ const src=document.getElementById('source'); src.innerHTML=''; const nodes=[];
  for(const b of BLOCKS){ const wrap=document.createElement('div'); wrap.innerHTML=b.html; const node=wrap.firstElementChild;
    if(b.masthead) node.dataset.masthead='1'; if(b.head) node.dataset.head='1'; src.appendChild(node); nodes.push(node); }
  return nodes; }
function makePage(pagesEl,isMast){ const p=el('div','page'+(isMast?' has-masthead':''));
  if(!isMast) p.appendChild(el('div','page-header','<span>Club Deportivo Prime</span><span class="hr-right">Solicitud de Reconocimiento Deportivo</span>'));
  const content=el('div','page-content'); p.appendChild(content); p.appendChild(el('div','page-footer','<span class="pageno"></span>')); pagesEl.appendChild(p); return content; }
function paginate(){ const pagesEl=document.getElementById('pages'); pagesEl.innerHTML=''; const nodes=buildSource(); let content=null;
  for(const node of nodes){ const isMast=node.dataset.masthead==='1';
    if(content===null||isMast) content=makePage(pagesEl,isMast);
    const clone=node.cloneNode(true); content.appendChild(clone);
    if(content.offsetHeight>CONTENT_H){ content.removeChild(clone); content=makePage(pagesEl,false); content.appendChild(clone); }
    else if(node.dataset.head==='1' && content.offsetHeight>CONTENT_H-150){ content.removeChild(clone); content=makePage(pagesEl,false); content.appendChild(clone); }
  }
  const all=[...pagesEl.querySelectorAll('.page')]; const total=all.length;
  all.forEach((pg,idx)=>{ const n=pg.querySelector('.pageno');
    if(n) n.textContent = total>1 ? ('Club Deportivo Prime  ·  Página '+(idx+1)+' de '+total) : 'Club Deportivo Prime'; });
}
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>setTimeout(paginate,60)); }
else window.addEventListener('load',()=>setTimeout(paginate,150));
</script>
</body>
</html>
